<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Pricing Engine</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #141a12;
    --surface: #1c251a;
    --surface2: #232e20;
    --border: rgba(255,255,255,0.07);
    --border-mid: rgba(255,255,255,0.14);
    --text: #eef0eb;
    --text-2: #9da89a;
    --text-3: #5a6358;
    --green: #4a8c3f;
    --green-light: #1e3a1a;
    --green-text: #7ec97a;
    --red: #8c3f3f;
    --red-light: #3a1a1a;
    --red-text: #c97a7a;
    --gold: #b8942a;
    --gold-light: #3a2e0a;
    --gold-text: #d4b84a;
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .page { max-width: 820px; margin: 0 auto; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 0.5px solid var(--border);
  }

  header h1 { font-size: 18px; font-weight: 500; letter-spacing: -0.01em; }
  header span { font-size: 12px; color: var(--text-3); }

  .section-title {
    font-size: 11px; font-weight: 500;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-3); margin-bottom: 10px;
  }

  /* Event picker */
  .event-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1.5rem; }

  .event-btn {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); cursor: pointer; font-family: inherit;
    color: var(--text); transition: border-color .15s, background .15s; text-align: left;
  }

  .event-btn:hover { border-color: var(--border-mid); background: var(--surface2); }
  .event-btn.active { border-color: var(--green-text); background: var(--green-light); }
  .event-name { font-size: 13px; font-weight: 500; }
  .event-meta { font-size: 11px; color: var(--text-3); text-align: right; }
  .event-tour { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: var(--surface2); color: var(--text-3); margin-left: 8px; }

  /* Controls */
  .controls {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: var(--surface2);
    border-radius: var(--radius-sm); margin-bottom: 1rem; flex-wrap: wrap;
  }

  .controls label { font-size: 12px; color: var(--text-2); }

  select.ctrl-sel {
    font-size: 12px; font-family: inherit;
    padding: 4px 8px; border: 0.5px solid var(--border-mid);
    border-radius: var(--radius-sm); background: var(--surface);
    color: var(--text); outline: none; cursor: pointer;
  }

  .fetch-btn {
    padding: 8px 16px; font-size: 13px; font-weight: 500; font-family: inherit;
    cursor: pointer; border: none; border-radius: var(--radius-sm);
    background: var(--green); color: #fff; transition: opacity .15s;
    display: flex; align-items: center; gap: 6px;
  }

  .fetch-btn:hover { opacity: .85; }
  .fetch-btn.loading { opacity: .6; cursor: wait; }

  .status {
    font-size: 11px; color: var(--text-3);
    margin-bottom: 1rem; min-height: 16px; text-align: center;
  }

  .status.ok  { color: var(--green-text); }
  .status.err { color: var(--red-text); }

  /* Player table */
  .table-wrap { overflow-x: auto; margin-bottom: 2rem; }

  table {
    width: 100%; border-collapse: collapse;
    font-size: 12px;
  }

  thead th {
    text-align: left; padding: 8px 10px;
    font-size: 10px; font-weight: 500; letter-spacing: .05em;
    text-transform: uppercase; color: var(--text-3);
    border-bottom: 0.5px solid var(--border-mid);
  }

  thead th.right { text-align: right; }

  tbody tr {
    border-bottom: 0.5px solid var(--border);
    transition: background .1s;
    cursor: pointer;
  }

  tbody tr:hover { background: var(--surface); }

  td {
    padding: 9px 10px; color: var(--text-2);
  }

  td.right { text-align: right; }
  td.name  { color: var(--text); font-weight: 500; font-size: 13px; }
  td.pos   { color: var(--text-3); font-size: 11px; width: 32px; }

  .rating-bar {
    display: flex; align-items: center; gap: 8px;
  }

  .bar-track {
    flex: 1; height: 6px; background: var(--surface2);
    border-radius: 3px; overflow: hidden; min-width: 60px;
  }

  .bar-fill {
    height: 100%; border-radius: 3px;
    background: var(--green); transition: width .3s ease;
  }

  .bar-fill.neg { background: var(--red); }

  .rating-val {
    font-size: 12px; font-weight: 500; min-width: 38px; text-align: right;
  }

  .rating-val.pos { color: var(--green-text); }
  .rating-val.neg { color: var(--red-text); }
  .rating-val.nil { color: var(--text-3); }

  .badge {
    display: inline-block; font-size: 10px; font-weight: 500;
    padding: 2px 7px; border-radius: 4px;
  }

  .bv   { background: var(--green-light); color: var(--green-text); }
  .ba   { background: var(--red-light);   color: var(--red-text); }
  .bf   { background: var(--surface2); color: var(--text-3); border: 0.5px solid var(--border); }
  .bgold { background: var(--gold-light); color: var(--gold-text); }

  /* Player detail panel */
  .detail-panel {
    display: none; background: var(--surface);
    border: 0.5px solid var(--border-mid);
    border-radius: var(--radius); padding: 1.25rem;
    margin-bottom: 1.5rem;
  }

  .detail-panel.open { display: block; }

  .detail-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1rem;
  }

  .detail-name { font-size: 16px; font-weight: 500; }
  .detail-close { background: none; border: none; color: var(--text-3); cursor: pointer; font-size: 18px; }

  .detail-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 10px; margin-bottom: 1rem;
  }

  .dstat {
    background: var(--surface2); border-radius: var(--radius-sm);
    padding: 10px 12px;
  }

  .dstat-lbl { font-size: 10px; color: var(--text-3); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
  .dstat-val { font-size: 18px; font-weight: 500; }

  .recent-results { margin-top: 1rem; }
  .result-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 0.5px solid var(--border); font-size: 12px;
  }

  .result-row:last-child { border-bottom: none; }
  .result-event { color: var(--text-2); flex: 1; }
  .result-pos   { color: var(--text-3); min-width: 40px; text-align: right; }
  .result-sg    { min-width: 55px; text-align: right; font-weight: 500; }
  .result-sg.pos { color: var(--green-text); }
  .result-sg.neg { color: var(--red-text); }

  .loading-row td { text-align: center; color: var(--text-3); padding: 2rem; }

  /* Filters */
  .filter-row {
    display: flex; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap;
  }

  .filter-btn {
    font-size: 11px; padding: 4px 10px;
    border: 0.5px solid var(--border-mid); border-radius: 20px;
    background: var(--surface2); color: var(--text-2);
    cursor: pointer; font-family: inherit; transition: all .15s;
  }

  .filter-btn.active { background: var(--green); color: #fff; border-color: var(--green); }

  .empty { font-size: 12px; color: var(--text-3); padding: 2rem 0; text-align: center; }
</style>
</head>
<body>
<div class="page">

  <header>
    <h1>Golf Pricing Engine</h1>
    <span id="event-title">Select a tournament</span>
  </header>

  <div class="section-title" style="margin-bottom:8px">Upcoming tournaments</div>
  <div class="event-list" id="event-list">
    <div class="empty">Loading events...</div>
  </div>

  <div class="controls">
    <label>Tour</label>
    <select class="ctrl-sel" id="tour-sel">
      <option value="both">PGA + DP World</option>
      <option value="pga">PGA Tour</option>
      <option value="eur">DP World Tour</option>
    </select>
    <label>Form</label>
    <select class="ctrl-sel" id="form-sel">
      <option value="5">Last 5 events</option>
      <option value="3">Last 3 events</option>
      <option value="8">Last 8 events</option>
    </select>
    <label>Show</label>
    <select class="ctrl-sel" id="show-sel">
      <option value="50">Top 50</option>
      <option value="20">Top 20</option>
      <option value="all">Full field</option>
    </select>
    <button class="fetch-btn" id="fetch-btn" onclick="fetchField()">&#x26F3; Analyse field</button>
  </div>

  <div class="status" id="status"></div>

  <div id="detail-panel" class="detail-panel">
    <div class="detail-header">
      <div class="detail-name" id="detail-name"></div>
      <button class="detail-close" onclick="closeDetail()">&#x00D7;</button>
    </div>
    <div class="detail-grid">
      <div class="dstat">
        <div class="dstat-lbl">Rating</div>
        <div class="dstat-val" id="detail-rating">—</div>
      </div>
      <div class="dstat">
        <div class="dstat-lbl">Win odds</div>
        <div class="dstat-val" id="detail-odds">—</div>
      </div>
      <div class="dstat">
        <div class="dstat-lbl">Implied prob</div>
        <div class="dstat-val" id="detail-imp">—</div>
      </div>
    </div>
    <div class="section-title">Recent results</div>
    <div class="recent-results" id="detail-results"></div>
  </div>

  <div class="filter-row" id="filter-row" style="display:none">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('value', this)">Value only</button>
    <button class="filter-btn" onclick="setFilter('top20', this)">Top 20 rated</button>
    <button class="filter-btn" onclick="setFilter('odds', this)">Has odds</button>
  </div>

  <div class="table-wrap">
    <table id="player-table">
      <thead>
        <tr>
          <th class="pos">#</th>
          <th>Player</th>
          <th>Country</th>
          <th>Form rating</th>
          <th class="right">Win odds</th>
          <th class="right">Implied</th>
          <th class="right">Value</th>
        </tr>
      </thead>
      <tbody id="player-tbody">
        <tr class="loading-row"><td colspan="7">Select a tournament and click Analyse field</td></tr>
      </tbody>
    </table>
  </div>

</div>
<script>
const SERVER = "https://web-production-c0742.up.railway.app";

let allPlayers  = [];
let currentFilter = 'all';
let selectedEvent = null;

// ── Event list ────────────────────────────────────────

async function loadEvents() {
  const list = document.getElementById('event-list');
  try {
    const res  = await fetch(`${SERVER}/api/events`);
    const data = await res.json();

    if (!data.events || data.events.length === 0) {
      list.innerHTML = '<div class="empty">No upcoming events found.</div>';
      return;
    }

    const tour = document.getElementById('tour-sel').value;
    const filtered = data.events.filter(e =>
      tour === 'both' || e.tour === tour
    );

    list.innerHTML = filtered.map((e, i) => {
      const date = new Date(e.date);
      const dateStr = date.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
      return `<button class="event-btn" onclick="selectEvent(${i})" id="evt-${i}" data-id="${e.id}" data-tour="${e.tour}" data-name="${e.name}">
        <span class="event-name">${e.name}<span class="event-tour">${e.tour.toUpperCase()}</span></span>
        <span class="event-meta">${dateStr}${e.venue ? ' · ' + e.venue : ''}</span>
      </button>`;
    }).join('');

    window._events = filtered;

  } catch(e) {
    list.innerHTML = '<div class="empty">Could not load events — check server is running.</div>';
  }
}

function selectEvent(i) {
  document.querySelectorAll('.event-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById(`evt-${i}`);
  if (btn) btn.classList.add('active');
  selectedEvent = window._events[i];
  document.getElementById('event-title').textContent = selectedEvent.name;
  // Reset table
  document.getElementById('player-tbody').innerHTML =
    '<tr class="loading-row"><td colspan="7">Click Analyse field to load players</td></tr>';
  document.getElementById('filter-row').style.display = 'none';
  allPlayers = [];
  closeDetail();
}

// ── Fetch & analyse ───────────────────────────────────

async function fetchField() {
  if (!selectedEvent) {
    setStatus('Select a tournament first', 'err');
    return;
  }

  const btn    = document.getElementById('fetch-btn');
  const lastN  = document.getElementById('form-sel').value;
  const showN  = document.getElementById('show-sel').value;

  btn.classList.add('loading');
  btn.textContent = 'Analysing...';
  setStatus('Fetching field and calculating ratings — this may take 30-60 seconds...', '');

  try {
    const res  = await fetch(`${SERVER}/api/analyse?event_id=${selectedEvent.id}&tour=${selectedEvent.tour}&last_n=${lastN}`);
    const data = await res.json();

    if (data.error) {
      setStatus('Error: ' + data.error, 'err');
      return;
    }

    allPlayers = data.players || [];
    setStatus(`Loaded ${allPlayers.length} players · odds from ${data.odds_source || 'not available'}`, 'ok');
    document.getElementById('filter-row').style.display = 'flex';
    renderTable(showN);

  } catch(e) {
    setStatus('Server error — check Railway deployment', 'err');
  } finally {
    btn.classList.remove('loading');
    btn.textContent = '⛳ Analyse field';
  }
}

// ── Table rendering ───────────────────────────────────

function renderTable(showN) {
  const tbody = document.getElementById('player-tbody');
  let players = [...allPlayers];

  // Apply filter
  if (currentFilter === 'value') {
    players = players.filter(p => p.odds && p.rating != null && (1/p.odds*100) < p.rating * 10);
  } else if (currentFilter === 'top20') {
    players = players.slice(0, 20);
  } else if (currentFilter === 'odds') {
    players = players.filter(p => p.odds);
  }

  // Apply show limit
  if (showN !== 'all') players = players.slice(0, parseInt(showN));

  if (players.length === 0) {
    tbody.innerHTML = '<tr class="loading-row"><td colspan="7">No players match the current filter</td></tr>';
    return;
  }

  // Find max rating for bar scaling
  const maxRating = Math.max(...players.map(p => Math.abs(p.rating || 0)), 1);

  tbody.innerHTML = players.map((p, i) => {
    const rating    = p.rating;
    const ratingVal = rating != null ? (rating > 0 ? '+' + rating.toFixed(2) : rating.toFixed(2)) : '—';
    const ratingCls = rating == null ? 'nil' : rating > 0 ? 'pos' : 'neg';
    const barPct    = rating != null ? Math.min(Math.abs(rating) / maxRating * 100, 100).toFixed(0) : 0;
    const barCls    = rating != null && rating < 0 ? 'neg' : '';

    const oddsStr  = p.odds ? p.odds.toFixed(2) : '—';
    const impStr   = p.implied_prob ? p.implied_prob.toFixed(1) + '%' : '—';

    // Simple value flag: if model rating is in top 20% but odds imply lower
    let valueBadge = '<span class="badge bf">—</span>';
    if (p.odds && rating != null) {
      const modelRank = players.indexOf(p) + 1;
      const totalRated = players.filter(x => x.rating != null).length;
      const rankPct = modelRank / totalRated;
      if (rankPct <= 0.15 && p.odds > 10) {
        valueBadge = '<span class="badge bv">Value</span>';
      } else if (rankPct <= 0.30 && p.odds > 20) {
        valueBadge = '<span class="badge bgold">Watch</span>';
      } else if (rankPct > 0.6 && p.odds && p.odds < 10) {
        valueBadge = '<span class="badge ba">Short</span>';
      }
    }

    return `<tr onclick="showDetail(${allPlayers.indexOf(p)})">
      <td class="pos">${i+1}</td>
      <td class="name">${p.name}</td>
      <td>${p.country || '—'}</td>
      <td>
        <div class="rating-bar">
          <div class="bar-track"><div class="bar-fill ${barCls}" style="width:${barPct}%"></div></div>
          <div class="rating-val ${ratingCls}">${ratingVal}</div>
        </div>
      </td>
      <td class="right">${oddsStr}</td>
      <td class="right">${impStr}</td>
      <td class="right">${valueBadge}</td>
    </tr>`;
  }).join('');
}

// ── Detail panel ──────────────────────────────────────

function showDetail(idx) {
  const p = allPlayers[idx];
  if (!p) return;

  document.getElementById('detail-name').textContent = p.name + (p.country ? ' · ' + p.country : '');
  document.getElementById('detail-rating').textContent = p.rating != null ? (p.rating > 0 ? '+' : '') + p.rating.toFixed(2) : '—';
  document.getElementById('detail-odds').textContent = p.odds ? p.odds.toFixed(2) : '—';
  document.getElementById('detail-imp').textContent = p.implied_prob ? p.implied_prob.toFixed(1) + '%' : '—';

  const results = p.recent || [];
  if (results.length === 0) {
    document.getElementById('detail-results').innerHTML = '<div class="empty">No recent results found</div>';
  } else {
    document.getElementById('detail-results').innerHTML = results.map(r => {
      const sg    = r.sg_vs_field;
      const sgStr = sg > 0 ? '+' + sg.toFixed(2) : sg.toFixed(2);
      const sgCls = sg > 0 ? 'pos' : 'neg';
      const tier  = r.tier_weight > 1 ? ' ★' : '';
      return `<div class="result-row">
        <span class="result-event">${r.event_name}${tier}</span>
        <span class="result-pos">${r.position || '—'}</span>
        <span class="result-sg ${sgCls}">${sgStr} vs field</span>
      </div>`;
    }).join('');
  }

  document.getElementById('detail-panel').classList.add('open');
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}

// ── Filters ───────────────────────────────────────────

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const showN = document.getElementById('show-sel').value;
  renderTable(showN);
}

// ── Utils ─────────────────────────────────────────────

function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + cls;
}

document.getElementById('tour-sel').onchange = loadEvents;
document.getElementById('show-sel').onchange = () => {
  if (allPlayers.length) renderTable(document.getElementById('show-sel').value);
};

loadEvents();
</script>
</body>
</html>
